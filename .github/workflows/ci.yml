name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# M2 (docs/MERGE_PLAN.md): квантовые крейты pqc/pqw живут в этом репозитории
# (crates/, единый Cargo Workspace) — никаких секретов и соседних клонов
# больше не требуется: обычный checkout собирает всё.

jobs:
  test:
    name: Тесты и линтер (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: "Clippy (гейт: unused/dead_code + correctness; стилевые — предупреждения)"
        run: cargo clippy --workspace --all-targets -- -D unused -D clippy::correctness

      - name: "Тесты (unit + integration, весь workspace: poler-engine + pqc + pqw)"
        run: cargo test --workspace --all-targets

      - name: Release-сборка
        run: cargo build --release --locked

      - name: Смоук-тест бинарника
        run: |
          ./target/release/poler-engine --version
          ./target/release/poler-engine tests/fixtures -q "нокс" --format simple
          ./target/release/poler-engine tests/fixtures -q "compute" --format simple
          ./target/release/poler-engine tests/fixtures --impact compute

      - name: Микробенчмарк
        run: cargo run --release --example bench

  # M4 (docs/UNIFIED_ARCHITECTURE.md): крипто-ядро Zig (os/core, PND v8.2
  # с P0-фиксами аудита Шнайера) + C-ABI мост в Rust. Двойная зелёность
  # обязательна: zig build test (ядро + parity) и cargo --features pnd-ffi.
  zig-core:
    name: Крипто-ядро Zig (os/core) + Rust FFI мост
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить Zig 0.14.0
        run: |
          curl -sL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | tar -xJ -C "$HOME"
          echo "$HOME/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: "Тесты крипто-ядра PND v8.2 (30: ядро + P0 аудита + C-ABI parity)"
        run: |
          cd os/core
          zig build test

      - name: "Rust FFI (фича pnd-ffi): golden-связка Zig-Rust"
        run: cargo test --lib --features pnd-ffi

      - name: "MVR-верификатор: побитовая сверка Python против Zig (54 626 golden-векторов)"
        run: |
          python3 -m pip install --user numpy z3-solver
          python3 tools/verifiers/verify_pnd_full.py --sections golden

  docker:
    name: Docker-образ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: poler-engine:ci
          load: true

      - name: Смоук-тест контейнера
        run: |
          docker run --rm poler-engine:ci --version
          docker run --rm -v "${PWD}/tests/fixtures:/data" poler-engine:ci /data -q "нокс" --format simple

  release:
    name: Релиз (по тегу v*)
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release-сборка
        run: cargo build --release --locked

      - name: Упаковка артефактов
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p dist/poler-engine
          cp -r src tests examples docs crates Cargo.toml Cargo.lock README.md FUTURE_ROADMAP.md INSTALL.md GLOSSARY.md CONTRIBUTING.md Dockerfile LICENSE-MIT LICENSE-APACHE dist/poler-engine/
          cp target/release/poler-engine dist/poler-engine/poler-engine-bin
          tar -czf "dist/poler-engine-${VERSION}-linux-x86_64.tar.gz" -C dist poler-engine
          tar --exclude='poler-engine/poler-engine-bin' -czf "dist/poler-engine-${VERSION}-src.tar.gz" -C dist poler-engine
          sha256sum dist/*.tar.gz > dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
