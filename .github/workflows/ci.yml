name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Предполёт (path-депы POLER-Quantum-RS)
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - name: Проверка секрета POLER_QUANTUM_TOKEN
        id: check
        env:
          TOKEN: ${{ secrets.POLER_QUANTUM_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "Секрет найден: test/docker/release будут запущены."
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секрет POLER_QUANTUM_TOKEN не задан — сборка пропущена. Репозиторий требует path-депы ../POLER-Quantum-RS_repo (INSTALL.md §2): задайте секрет с доступом на чтение к poler-engine-org/POLER-Quantum-RS, либо выполните консолидацию монорепозитория (docs/MERGE_PLAN.md)."
          fi

  test:
    name: Тесты и линтер (${{ matrix.os }})
    needs: preflight
    if: needs.preflight.outputs.has_token == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Клон квантового ядра (path-депы pqc/pqw)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.POLER_QUANTUM_TOKEN }}@github.com/poler-engine-org/POLER-Quantum-RS.git" \
            "$GITHUB_WORKSPACE/../POLER-Quantum-RS_repo"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: "Clippy (гейт: unused/dead_code + correctness; стилевые — предупреждения)"
        run: cargo clippy --all-targets -- -D unused -D clippy::correctness

      - name: Тесты (unit + integration)
        run: cargo test --all-targets

      - name: Release-сборка
        run: cargo build --release --locked

      - name: Смоук-тест бинарника
        run: |
          ./target/release/poler-engine --version
          ./target/release/poler-engine tests/fixtures -q "нокс" --format simple
          ./target/release/poler-engine tests/fixtures -q "compute" --format simple
          ./target/release/poler-engine tests/fixtures --impact compute

      - name: Микробенчмарк
        run: cargo run --release --example bench

  docker:
    name: Docker-образ
    needs: preflight
    if: needs.preflight.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Клон квантового ядра в контекст сборки (path-депы)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.POLER_QUANTUM_TOKEN }}@github.com/poler-engine-org/POLER-Quantum-RS.git" \
            POLER-Quantum-RS_repo

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: poler-engine:ci
          load: true

      - name: Смоук-тест контейнера
        run: |
          docker run --rm poler-engine:ci --version
          docker run --rm -v "${PWD}/tests/fixtures:/data" poler-engine:ci /data -q "нокс" --format simple

  release:
    name: Релиз (по тегу v*)
    needs: [preflight, test]
    if: needs.preflight.outputs.has_token == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Клон квантового ядра (path-депы pqc/pqw)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.POLER_QUANTUM_TOKEN }}@github.com/poler-engine-org/POLER-Quantum-RS.git" \
            "$GITHUB_WORKSPACE/../POLER-Quantum-RS_repo"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release-сборка
        run: cargo build --release --locked

      - name: Упаковка артефактов
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p dist/poler-engine
          cp -r src tests examples docs Cargo.toml Cargo.lock README.md FUTURE_ROADMAP.md INSTALL.md GLOSSARY.md CONTRIBUTING.md Dockerfile LICENSE-MIT LICENSE-APACHE dist/poler-engine/
          cp target/release/poler-engine dist/poler-engine/poler-engine-bin
          tar -czf "dist/poler-engine-${VERSION}-linux-x86_64.tar.gz" -C dist poler-engine
          tar --exclude='poler-engine/poler-engine-bin' -czf "dist/poler-engine-${VERSION}-src.tar.gz" -C dist poler-engine
          sha256sum dist/*.tar.gz > dist/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
