<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
  <title>Аниме-конвейер (Canvas + TTS)</title>
<style>
body { margin: 0; background: #1a1a2e; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
canvas { background: #16213e; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
.controls { margin: 20px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; align-items: center; }
button { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 18px; cursor: pointer; }
button:hover { background: #c23152; }
select, input[type="range"] { padding: 5px; background: #0f3460; color: white; border: none; border-radius: 6px; }
label { font-size: 14px; }
</style>
</head>
<body>
  <h1>🎬 Аниме-сцена (Canvas + Web Speech API)</h1>
<canvas id="mainCanvas" width="800" height="450"></canvas>

<div class="controls">
<label>Скорость речи: <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"></label>
<label>Высота голоса Хинаты: <input type="range" id="pitch1" min="0.5" max="2" step="0.1" value="1.4"></label>
<label>Высота голоса Какэру: <input type="range" id="pitch2" min="0.5" max="2" step="0.1" value="0.8"></label>
    <button id="startBtn">▶ Запустить анимацию</button>
<button id="downloadBtn" disabled>⬇ Скачать видео</button>
</div>

<script>
// ============ СЦЕНАРИЙ ============
const scenes = [
{ bg: "#87CEEB", characters: [{ type: "hinata", x: 200, y: 250, emotion: "happy" }],
        dialogue: { text: "Какэру! Я нашла старую карту! Смотри!", voice: "hinata" }, duration: 5 },
{ bg: "#87CEEB", characters: [{ type: "kakeru", x: 500, y: 250, emotion: "surprised" }],
dialogue: { text: "Карту? О чём она?", voice: "kakeru" }, duration: 4 },
{ bg: "#87CEEB", characters: [
{ type: "hinata", x: 200, y: 250, emotion: "excited" },
{ type: "kakeru", x: 500, y: 250, emotion: "curious" }
],
        dialogue: { text: "Там указан путь к Храму Звёзд. Нам нужно идти!", voice: "hinata" }, duration: 5 }
];

// ============ РИСОВАНИЕ ПЕРСОНАЖЕЙ ============
function drawHinata(ctx, x, y, emotion) {
// Тело
ctx.fillStyle = "#ffb3c6"; ctx.fillRect(x-15, y+20, 30, 60);
// Голова
ctx.fillStyle = "#ffe0bd"; ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2); ctx.fill();
// Волосы (хвостики)
ctx.fillStyle = "#ff66b2"; ctx.beginPath(); ctx.arc(x-20, y-25, 15, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(x+20, y-25, 15, 0, Math.PI*2); ctx.fill();
ctx.fillRect(x-35, y-10, 70, 15);
// Глаза
ctx.fillStyle = "#000";
if (emotion === "happy") {
ctx.beginPath(); ctx.arc(x-10, y-5, 4, 0, Math.PI, false); ctx.fill(); // ^_^
ctx.beginPath(); ctx.arc(x+10, y-5, 4, 0, Math.PI, false); ctx.fill();
} else if (emotion === "excited") {
ctx.beginPath(); ctx.arc(x-10, y-7, 5, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(x+10, y-7, 5, 0, Math.PI*2); ctx.fill();
}
// Рот
ctx.beginPath(); ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
if (emotion === "happy" || emotion === "excited") ctx.arc(x, y+8, 8, 0, Math.PI);
else ctx.arc(x, y+10, 5, 0, Math.PI, true);
ctx.stroke();
}

function drawKakeru(ctx, x, y, emotion) {
// Тело
ctx.fillStyle = "#6fa8dc"; ctx.fillRect(x-15, y+20, 30, 60);
// Голова
ctx.fillStyle = "#ffe0bd"; ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2); ctx.fill();
// Волосы (темные)
ctx.fillStyle = "#444"; ctx.beginPath(); ctx.arc(x, y-5, 32, 0, Math.PI*2); ctx.fill();
// Глаза
ctx.fillStyle = "#000";
ctx.beginPath(); ctx.arc(x-10, y-5, 4, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(x+10, y-5, 4, 0, Math.PI*2); ctx.fill();
// Брови (меняются)
ctx.lineWidth = 2;
if (emotion === "surprised") {
ctx.moveTo(x-15, y-12); ctx.lineTo(x-7, y-16); ctx.stroke();
ctx.moveTo(x+15, y-12); ctx.lineTo(x+7, y-16); ctx.stroke();
} else {
ctx.moveTo(x-15, y-15); ctx.lineTo(x-5, y-15); ctx.stroke();
ctx.moveTo(x+15, y-15); ctx.lineTo(x+5, y-15); ctx.stroke();
}
// Рот
ctx.beginPath(); ctx.strokeStyle = "#000";
if (emotion === "surprised") ctx.arc(x, y+8, 5, 0, Math.PI*2);
else ctx.moveTo(x-5, y+10); ctx.lineTo(x+5, y+10);
ctx.stroke();
}

function drawScene(scene) {
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
ctx.clearRect(0, 0, canvas.width, canvas.height);
// Фон
ctx.fillStyle = scene.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
// Земля/холм
ctx.fillStyle = "#6ab04c"; ctx.beginPath(); ctx.ellipse(400, 400, 500, 100, 0, 0, Math.PI*2); ctx.fill();
// Персонажи
scene.characters.forEach(ch => {
if (ch.type === "hinata") drawHinata(ctx, ch.x, ch.y, ch.emotion);
else if (ch.type === "kakeru") drawKakeru(ctx, ch.x, ch.y, ch.emotion);
});
}

// ============ ОЗВУЧКА ============
let voices = [];
speechSynthesis.onvoiceschanged = () => {
voices = speechSynthesis.getVoices();
};

function speak(text, options = {}) {
return new Promise((resolve) => {
const utterance = new SpeechSynthesisUtterance(text);
utterance.lang = 'ru-RU';
utterance.rate = parseFloat(document.getElementById('rate').value);
utterance.pitch = options.pitch || 1;
utterance.voice = voices.find(v => v.lang.startsWith('ru')) || null;
utterance.onend = resolve;
speechSynthesis.speak(utterance);
});
}

// ============ ЗАПИСЬ ВИДЕО ============
let mediaRecorder, recordedChunks = [];

async function startRecording() {
const canvas = document.getElementById('mainCanvas');
const stream = canvas.captureStream(30);
const audioCtx = new AudioContext();
const dest = audioCtx.createMediaStreamDestination();
// Придётся подключить oscillator или захватывать системный звук, но проще добавить тишину и подмешать речь позже.
// Упростим: будем записывать без звука, а затем добавим аудио через монтаж, но в данном прототипе показываем только видео.
// (Полноценный липсинк требует Web Audio API с MediaRecorder, что сложнее. Оставим как улучшение.)
const combined = new MediaStream([...stream.getVideoTracks()]);
mediaRecorder = new MediaRecorder(combined, { mimeType: 'video/webm' });
mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
mediaRecorder.onstop = () => {
const blob = new Blob(recordedChunks, { type: 'video/webm' });
const url = URL.createObjectURL(blob);
const btn = document.getElementById('downloadBtn');
btn.disabled = false;
btn.onclick = () => {
const a = document.createElement('a');
a.href = url; a.download = 'anime_scene.webm'; a.click();
};
};
mediaRecorder.start();
}

// ============ ГЛАВНЫЙ ЦИКЛ ============
async function runAnimation() {
drawScene({ bg: "#87CEEB", characters: [] }); // начальный фон
await new Promise(r => setTimeout(r, 500));
startRecording();

for (const scene of scenes) {
drawScene(scene);
const pitch = scene.dialogue.voice === "hinata"
? parseFloat(document.getElementById('pitch1').value)
: parseFloat(document.getElementById('pitch2').value);
await speak(scene.dialogue.text, { pitch });
// Ждём оставшееся время сцены после речи
const minDuration = scene.duration * 1000;
        await new Promise(r => setTimeout(r, 500)); // маленькая пауза
}
mediaRecorder.stop();
}

document.getElementById('startBtn').addEventListener('click', () => {
document.getElementById('downloadBtn').disabled = true;
recordedChunks = [];
runAnimation();
});
</script>
</body>
</html>
