<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СИСТЕМА КАССІОПЕЇ: Наукова модель | Геліос-Кронос-Ефір</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: radial-gradient(ellipse at center, #0a0e20 0%, #010308 100%);
color: #e0e7ff; font-family: 'Segoe UI', system-ui, sans-serif;
height: 100vh; overflow: hidden;
}
#canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

/* Панель керування */
.hud {
position: absolute; top: 20px; right: 20px; width: 400px; z-index: 10;
background: rgba(7, 12, 28, 0.92); border: 1px solid rgba(74, 144, 226, 0.4);
border-radius: 16px; padding: 20px; backdrop-filter: blur(12px);
font-size: 0.95rem; line-height: 1.6;
}
.hud h1 {
font-size: 1.4rem; margin-bottom: 15px; color: #6366f1;
display: flex; align-items: center; gap: 12px;
}
.hud h1::before { content: "🌌"; font-size: 1.6rem; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0; }
.stat-item {
background: linear-gradient(135deg, rgba(26, 32, 55, 0.8) 0%, rgba(15, 23, 42, 0.6) 100%);
padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(74, 144, 226, 0.2);
display: flex; flex-direction: column; transition: transform 0.3s;
}
.stat-item:hover { transform: translateY(-2px); }
.stat-label { font-size: 0.82rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-weight: 700; color: #4ade80; font-size: 1.1rem; margin-top: 4px; }
.controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
.btn {
background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(56, 189, 248, 0.05) 100%);
border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8;
padding: 10px 6px; border-radius: 8px; cursor: pointer;
font-size: 0.88rem; transition: all 0.25s; display: flex; align-items: center;
justify-content: center; gap: 6px;
}
.btn:hover { background: rgba(56, 189, 248, 0.3); transform: scale(1.05); }
.btn.active {
background: linear-gradient(135deg, rgba(168, 85, 247, 0.4) 0%, rgba(168, 85, 247, 0.15) 100%);
border-color: #a855f7; color: #c084fc; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
}

/* Інформаційна панель */
#info {
position: absolute; bottom: 20px; left: 20px; width: 420px; max-height: 280px;
background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(168, 85, 247, 0.5);
border-radius: 16px; padding: 20px; backdrop-filter: blur(15px);
overflow-y: auto; font-size: 0.92rem; line-height: 1.65;
transform: translateY(40px); opacity: 0; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
}
#info.visible { transform: translateY(0); opacity: 1; }
#info h2 {
color: #818cf8; margin-bottom: 12px; display: flex; align-items: center;
gap: 10px; font-size: 1.3rem;
}
#info h2::before { content: "✦"; color: #c084fc; font-size: 1.5rem; }
#info p { color: #cbd5e1; margin: 8px 0; }
#info .params { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 15px; }
.param {
background: rgba(30, 41, 59, 0.6); padding: 8px 12px; border-radius: 8px;
border-left: 3px solid rgba(251, 191, 36, 0.5);
}
.param-label { color: #94a3b8; font-size: 0.85rem; }
.param-value { color: #fbbf24; font-weight: 600; font-size: 0.95rem; }

/* Завантаження */
#loader {
position: fixed; inset: 0; background: #010308; display: flex;
flex-direction: column; justify-content: center; align-items: center;
z-index: 1000; transition: opacity 0.8s ease;
}
.spinner {
width: 70px; height: 70px; border: 5px solid rgba(74, 144, 226, 0.15);
border-top: 5px solid #4a90e2; border-radius: 50%;
animation: spin 1.5s linear infinite; margin-bottom: 30px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text {
color: #94a3b8; font-size: 1.3rem; letter-spacing: 2px;
margin-bottom: 10px;
}
.loader-sub {
color: #64748b; font-size: 0.9rem; text-align: center; max-width: 300px;
line-height: 1.6;
}

/* Концентричні кола резонансів */
.resonance {
position: absolute; top: 50%; left: 50%; width: 800px; height: 800px;
transform: translate(-50%, -50%); pointer-events: none; opacity: 0.12;
border: 2px dashed rgba(255, 255, 255, 0.15); border-radius: 50%;
transition: opacity 0.5s, transform 0.5s;
}
.resonance.active { opacity: 0.35; }
.resonance-label {
position: absolute; color: rgba(255, 255, 255, 0.7); font-size: 0.9rem;
pointer-events: none; transform: translateX(-50%); background: rgba(0, 0, 0, 0.5);
padding: 2px 10px; border-radius: 10px; white-space: nowrap;
font-weight: 500;
}

/* Кнопка закриття інфо */
.close-info {
position: absolute; top: 15px; right: 15px; background: rgba(168, 85, 247, 0.2);
border: 1px solid rgba(168, 85, 247, 0.4); color: #c084fc;
width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
display: flex; align-items: center; justify-content: center;
font-size: 1.2rem; transition: all 0.2s;
}
.close-info:hover { background: rgba(168, 85, 247, 0.4); transform: rotate(90deg); }

/* Діаграма мас */
.mass-diagram {
position: absolute; bottom: 20px; right: 440px; width: 300px; height: 180px;
background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(56, 189, 248, 0.4);
border-radius: 12px; padding: 15px; backdrop-filter: blur(10px);
opacity: 0.8; transition: opacity 0.3s;
}
.mass-diagram:hover { opacity: 1; }
.mass-diagram h3 {
color: #38bdf8; font-size: 1rem; margin-bottom: 10px;
display: flex; align-items: center; gap: 8px;
}
.mass-diagram h3::before { content: "⚖️"; }
.mass-bar {
height: 20px; margin: 6px 0; border-radius: 4px;
background: linear-gradient(90deg, #3b82f6, #8b5cf6);
transition: width 1s ease-out;
}
</style>
</head>
<body>
<div id="loader">
<div class="spinner"></div>
