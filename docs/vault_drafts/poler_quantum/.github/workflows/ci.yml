name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run test suite
        run: pytest

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Demos
        run: |
          poler-quantum demo
          poler-quantum quantum
          poler-quantum compress
          poler-quantum spec
      - name: Benchmark (3 seeds)
        run: poler-quantum benchmark --T 200 --dim 6 --seeds 3 --outdir results
      - name: Upload figures and metrics
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/
